[project]
name = "status-report"
version = "0.1.0"
description = "Weekly status report generator that pulls sprint data from Jira Cloud"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
    "jinja2",
    "premailer",
    "typer",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
report = "status_report.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
